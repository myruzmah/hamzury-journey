<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hamzury — Learn What Works</title>
  <meta name="description" content="Hamzury Innovation Hub. Start where you are. We check your level and show you the next step.">
  <meta name="theme-color" content="#0a1c30">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="Hamzury — Learn What Works">
  <meta property="og:description" content="Start where you are. We show you the next step.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="top">
    <button onclick="window.app.top()" aria-label="Hamzury">
      <img class="lockup" src="/assets/logo.png" alt="Hamzury">
    </button>
    <nav class="topnav" aria-label="Primary">
      <button class="keep" onclick="window.app.open('prospectus')">Prospectus</button>
      <button onclick="window.app.open('treasury')">Treasury</button>
      <button onclick="window.app.open('life')">Life</button>
      <button class="keep" onclick="window.app.open('login')">Status</button>
    </nav>
  </header>

  <main id="main">
    <section class="hero">
      <div class="label accent">Hamzury Innovation Hub</div>
      <h1 class="display">LEARN<span>WHAT WORKS.</span></h1>
      <div class="actions">
        <button class="btn primary" onclick="window.app.open('paths')">Find my path</button>
        <button class="btn quiet" onclick="window.app.open('prospectus')">Download Prospectus</button>
      </div>
    </section>

    <section class="stance">
      <div class="label">Our philosophy</div>
      <h2 style="margin-top:16px">Business is built.<span>Not attended.</span></h2>
      <div class="flow" id="stance-flow"></div>
      <button class="vtoggle" id="vtoggle" aria-expanded="false" onclick="window.app.toggleValues()">
        <span>What we mean by that</span><span class="chev">›</span>
      </button>
      <table class="values" id="values"></table>
      <p class="core">You do not learn everything first. <em>You learn what works, then use it.</em></p>
    </section>

    <div class="group">
      <div class="label">Where do you want to go?</div>
      <div class="index" id="index"></div>
    </div>
  </main>

  <footer class="foot">
    <img class="lockup" id="footlogo" onclick="window.app.staffTap()" alt="Hamzury" src="/assets/logo.png">
    <div class="footlinks">
      <button onclick="window.app.open('questions')">Questions</button>
      <button onclick="window.app.open('fees')">Fees</button>
      <button onclick="window.app.open('prospectus')">Prospectus</button>
      <button onclick="window.app.open('terms')">Terms & Policy</button>
      <button onclick="window.app.open('apply')">Apply</button>
      <button onclick="window.app.open('admin')">Staff Portal</button>
      <span class="tiny">Payment evidence is checked by a person</span>
    </div>
  </footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt" hidden>
    <div class="panel" id="panel" tabindex="-1">
      <div class="panelbar">
        <button class="iconbtn wide" id="backbtn" onclick="window.app.back()" hidden>← Back</button>
        <span></span>
        <button class="iconbtn" onclick="window.app.close()" aria-label="Close">✕</button>
      </div>
      <div id="content"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
